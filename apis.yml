aid: digital-shadows
name: Digital Shadows
description: 'Digital Shadows is a London-founded digital risk protection (DRP) company
  whose SearchLight platform monitors the open, deep and dark web for data leakage,
  exposed credentials, brand impersonation, exposed infrastructure and threat-actor
  activity affecting a customer''s organization. ReliaQuest acquired Digital Shadows
  in July 2022 and the entity now trades as ReliaQuest UK Limited, with SearchLight
  folded into ReliaQuest GreyMatter Digital Risk Protection. The SearchLight Portal
  API remains live at portal-digitalshadows.com/api/ and is consumed by first-party
  tooling (the shadowline Python CLI and the Splunk SOAR connector) and by a wide
  third-party integration surface (Cortex XSOAR, ThreatConnect, Splunk, Sekoia,
  Axonius, TheHive, Atlassian Marketplace). The API reference itself is published
  only inside the authenticated customer portal.'

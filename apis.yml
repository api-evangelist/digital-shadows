apis:
- name: SearchLight Portal API
  description: 'The Digital Shadows SearchLight Portal API — the REST surface behind
    the SearchLight / GreyMatter DRP portal. Exposes incidents, intelligence incidents,
    intelligence threats, data breaches and breach usernames, DNS and domain WHOIS
    lookups, IP WHOIS, exposed infrastructure (ports, SSL, vulnerabilities), IOC
    retrieval, and a cross-entity search endpoint. Authenticated with HTTP Basic
    using a portal-issued API key and secret; versioned through a vendor media type
    (application/vnd.polaris-vNN+json). The reference is published inside the
    authenticated portal under Portal > SearchLight API doc, so there is no public
    OpenAPI or reference page.'

note: >-
  Digital Shadows publishes no client library to npm, PyPI, RubyGems, Maven Central,
  NuGet, Packagist, crates.io or pkg.go.dev. Every probe returned 404 (see
  registry_probes below). The first-party client surface is distributed as source
  from the github.com/digitalshadows organization and as a packaged connector on
  Splunkbase. The PyPI package named `searchlight-api` is NOT Digital Shadows —
  it is Conductor's Searchlight SEO API client
  (https://github.com/Conductor/searchlight-api-client-python) — and is deliberately
  excluded here.
